[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specsy-online"
version = "0.8.0"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-or-later"
authors = [{name = "Vital Fernández", email = "vgf@stsci.edu"}]
description = "Streamlit wrapper for Specsy functions"
dependencies = ["aspect-stable @ git+https://github.com/Vital-Fernandez/aspect.git@master",
                "lime-stable[full] @ git+https://github.com/Vital-Fernandez/lime.git@master",
                "innate-stable @ git+https://github.com/Vital-Fernandez/innate.git@master",
                "specsy[tensors] @ git+https://github.com/Vital-Fernandez/specsy.git@master",
                "pyneb~=1.1.28",
                "tomlkit~=0.14.0",
                "bokeh==3.9.0",
                "streamlit==1.55.0",
                "streamlit_bokeh==3.9.0",
                "streamlit-authenticator==0.4.2",
                "st-gsheets-connection~=0.1",
                "google-api-python-client~=2.187.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["specsy_online*"]

[project.scripts]
specsy = "specsy_online.launcher:main"

[tool.setuptools.package-data]
specsy_online = ["resources/data/*",
                 "resources/images/*",
                 ".streamlit/config.toml"]