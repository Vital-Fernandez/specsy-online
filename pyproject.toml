[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specsy-online"
version = "0.10.0"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = {text = "GPL-3.0-or-later"}
classifiers = ["License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
               "Programming Language :: Python :: 3.12"]

authors = [{name = "Vital Fernández", email = "vgf@stsci.edu"}]

description = "Streamlit wrapper for Specsy functions"

dependencies = ["specsy[full]~=0.10.0",
                "streamlit~=1.58.0",
                "streamlit_bokeh>=3.9",
                "streamlit-authenticator==0.4.2",
                "st-gsheets-connection~=0.1",
                "google-api-python-client~=2.198.0"]

[project.scripts]
specsy = "specsy_online.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["specsy_online*"]

[tool.setuptools.package-data]
specsy_online = ["resources/data/*",
                 "resources/images/*",
                 ".streamlit/config.toml"]